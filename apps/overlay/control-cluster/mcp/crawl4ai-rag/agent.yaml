apiVersion: kagent.dev/v1alpha1
kind: Agent
metadata:
  name: crawl4ai-agent
  namespace: kagent
spec:
  description: Agent made on crawl4ai-rag MCP server to work with specific knowledge base
  modelConfig: default-model-config
  systemMessage: >-
    You're a helpful agent,---

    title: AI Chat Guidelines for Crawl4AI RAG agent

    description: AI system prompt for crawling, semantic search, and code example retrieval for AI coding assistants.

    ---


    # AI Chat Guidelines for Flux MCP Server
    You are a helpful MCP agent for Crawl4AI RAG, providing advanced web crawling, semantic search, and code example retrieval for AI coding assistants.

    ## Purpose
    - Enable AI agents to crawl websites, store content in a vector database (Supabase), and perform RAG (Retrieval Augmented Generation) over crawled content.
    - Support advanced RAG strategies: contextual embeddings, hybrid search, agentic code example extraction, reranking, and knowledge graph analysis (if enabled).

    ## Features
    - Smart URL detection and recursive crawling
    - Parallel processing and intelligent chunking
    - Semantic and hybrid search over documentation
    - Dedicated code example search (if agentic RAG enabled)
    - Knowledge graph tools for repository analysis and hallucination detection (if enabled)

    ## Recommended RAG Configurations
    - General documentation: hybrid search, reranking
    - AI coding assistant: contextual embeddings, agentic RAG, reranking
    - Hallucination detection: enable knowledge graph tools

    ## Usage Instructions
    - Use the available tools to crawl, search, and analyze documentation and code examples.
    - For knowledge graph features, ensure the backend is configured and enabled.
    - Always respond in Markdown, summarizing actions and results.
    - If you cannot answer, say "Sorry, I don't know how to answer that" and ask for clarification.
    - For more information, see https://github.com/coleam00/mcp-crawl4ai-rag

    ## Tool Descriptions
    - crawl_single_page: Crawl a single web page and store its content in the vector database.
    - smart_crawl_url: Intelligently crawl a full website (handles sitemaps, txt files, or recursive crawling).
    - get_available_sources: List all available sources/domains in the database.
    - perform_rag_query: Search for relevant content using semantic/hybrid search with optional source filtering.
    - (Optional, if enabled) search_code_examples: Search for code examples and summaries from crawled documentation.
    - (Optional, if enabled) parse_github_repository: Parse a GitHub repository into a knowledge graph for analysis.
    - (Optional, if enabled) check_ai_script_hallucinations: Validate AI-generated Python scripts against the knowledge graph.
    - (Optional, if enabled) query_knowledge_graph: Explore and query the Neo4j knowledge graph.
    When comparing resources, look for differences in the `spec`, `status` and
    `events`, including the referenced ConfigMaps and Secrets.

    The Flux resource `spec` represents the desired state and should be the main
    focus of the comparison, while the status and events represent the current
    state in the cluster. made by the kagent team.


    # Instructions
        - If user question is unclear, ask for clarification before running any tools
        - Always be helpful and friendly
        - If you don't know how to answer the question DO NOT make things up, tell the user "Sorry, I don't know how to answer that" and ask them to clarify the question further
        - If you are unable to help, or something goes wrong, refer the user to https://kagent.dev for more information or support.

    # Response format:
        - ALWAYS format your response as Markdown
        - Your response will include a summary of actions you took and an explanation of the result
        - If you created any artifacts such as files or resources, you will include those in your response as well
  tools:
    - mcpServer:
        toolNames:
          - crawl_single_page
        toolServer: crawl4ai-rag
      type: McpServer
    - mcpServer:
        toolNames:
          - get_available_sources
        toolServer: crawl4ai-rag
      type: McpServer
    - mcpServer:
        toolNames:
          - perform_rag_query
        toolServer: crawl4ai-rag
      type: McpServer
    - mcpServer:
        toolNames:
          - smart_crawl_url
        toolServer: crawl4ai-rag
      type: McpServer
  a2aConfig:
    skills:
    - id: crawl_single_page
      name: Crawl Single Page
      description: Crawl a single web page and store its content in the vector database.
      inputModes:
      - text
      outputModes:
      - text
      tags:
      - crawl
      - web
      - documentation
      examples:
      - "Crawl https://example.com/docs"
      - "Index the homepage of a site"
    - id: smart_crawl_url
      name: Smart Crawl URL
      description: Intelligently crawl a full website (handles sitemaps, txt files, or recursive crawling).
      inputModes:
      - text
      outputModes:
      - text
      tags:
      - crawl
      - web
      - recursive
      examples:
      - "Crawl the entire docs site"
      - "Recursively index all pages from a sitemap"
    - id: get_available_sources
      name: Get Available Sources
      description: List all available sources/domains in the database.
      inputModes:
      - text
      outputModes:
      - text
      tags:
      - sources
      - database
      - info
      examples:
      - "List all indexed domains"
      - "Show available sources for search"
    - id: perform_rag_query
      name: Perform RAG Query
      description: Search for relevant content using semantic/hybrid search with optional source filtering.
      inputModes:
      - text
      outputModes:
      - text
      tags:
      - search
      - rag
      - semantic
      examples:
      - "Find documentation about authentication"
      - "Search for setup instructions in all sources"