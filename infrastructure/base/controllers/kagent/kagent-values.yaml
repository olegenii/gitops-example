    pullPolicy: ""
    registry: ""
    repository: kagent-dev/kagent/controller
    tag: ""
  loglevel: info
  nodeSelector: {}
  replicas: 1
  resources:
    limits:
      cpu: 2
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    ports:
      port: 8083
      targetPort: 8083
    type: ClusterIP
