  logging:
    enabled: false
    exporter:
      otlp:
        endpoint: http://host.docker.internal:4317
        insecure: true
        timeout: 15
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: http://jaeger-collector.jaeger.svc.cluster.local:4317
        insecure: true
        timeout: 15
podAnnotations: {}
podSecurityContext: {}
promql-agent:
  global: {}
  modelConfigRef: ""
providers:
  anthropic:
    apiKeySecretKey: ANTHROPIC_API_KEY
    apiKeySecretRef: kagent-anthropic
    model: claude-3-sonnet-20240229
    provider: Anthropic
  azureOpenAI:
    apiKeySecretRef: kagent-azure-openai
    apiKeySecretKey: o4_mini
    config:
      apiVersion: "2024-12-01-preview"
      azureAdToken: ""
      azureDeployment: "04-mini"
      azureEndpoint: "https://olegen.openai.azure.com/"
    model: o4-mini
    provider: AzureOpenAI
  default: AzureOpenAI
  ollama:
    config:
      host: host.docker.internal:11434
    model: llama3.2
    provider: Ollama
  openAI:
    apiKeySecretKey: OPENAI_API_KEY
    apiKeySecretRef: kagent-openai
    model: gpt-4.1-mini
    provider: OpenAI
